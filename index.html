<script>const DATA={"chapters": [{"id": "assertions", "title": "Räkenskapspåståenden", "slides": "4–16", "isa": ["ISA 315", "ISA 330"], "summary": "Kursens grundlogik: förstå vad som kan gå fel, koppla risken till rätt assertion och utforma en revisionsrespons som ger relevant bevis.", "learn": ["BDO:s fem assertions: Fullständighet [C], Existens [E], Riktighet [A], Värdering [V] och Presentation [P].", "Poster under väsentlighet scoppas utifrån identifierad RMM. För poster över övergripande väsentlighet behöver teamet välja relevanta assertions och motivera om något inte innebär risk.", "Olika verksamhetsgrenar och intäktsströmmar kan ha olika relevanta assertions."], "model": ["Fullständighet: börja utanför bokföringen och sök det som borde ha bokförts.", "Existens: börja i bokföringen och verifiera att det bokförda finns eller har inträffat.", "Riktighet: kontrollera registrering, summering, klassificering och faktisk data.", "Värdering: bedöm om balansposter redovisas till rätt belopp, ofta med uppskattningar.", "Presentation: bedöm uppdelning, klassificering, beskrivningar och upplysningar."], "risks": ["Skulder eller avsättningar utelämnas för att förbättra resultatet [C].", "Tillgångar eller intäkter redovisas utan verklig grund [E].", "Manuell input eller systemberäkningar blir fel [A].", "Reserveringar, marknadsvärden eller återvinningsvärden blir fel [V].", "Förvärv, kassaflöden eller andra upplysningar presenteras otillräckligt [P]."], "procedures": ["C: avklipp, efterföljande betalningar, fraktsedlar eller annan alternativ population.", "E: fysisk inspektion, kontrollinventering, saldoförfrågan eller efterföljande betalning.", "A: kontrollsummering, kontrollberäkning och stickprov mot verifikationsunderlag.", "V: marknadskurser, NRV-test, åldersanalys, efterföljande utfall eller värderingsexpert.", "P: årsredovisningschecklista och specifik bedömning av obligatoriska upplysningar."], "say": "Vi börjar i vad som kan gå fel. Risken kopplas till ett relevant assertion och sedan till en åtgärd som uttryckligen ger bevis för just det påståendet.", "pitfalls": ["Risk och assertion är inte samma sak.", "Fullständighet och existens testas normalt i motsatt riktning.", "Värdering används enligt kursmaterialet för balansposter, medan riktighet används bredare för faktisk data och registrering."], "bdo": ["Sökord i BDO Audit Manual: “Comparison of BDO Assertions to those in ISA 315”.", "Kursmaterialet hänvisar till BDO Audit Manual 6.15 i intäktsavsnittet."]}, {"id": "intangibles", "title": "Immateriella anläggningstillgångar", "slides": "17–45", "isa": ["ISA 315", "ISA 500", "ISA 540"], "summary": "Definition, anskaffningsvärde, förvärvade och egenupparbetade tillgångar, aktiveringsmodellen, avskrivning, nedskrivning och revision.", "learn": ["En identifierbar icke-monetär tillgång utan fysisk form. Identifierbar genom avskiljbarhet eller avtalsenliga/juridiska rättigheter.", "K2 tillåter inte aktivering av egenupparbetade immateriella tillgångar.", "K3 har kostnadsföringsmodell eller aktiveringsmodell. Vald modell tillämpas konsekvent.", "Forskningsfas kostnadsförs. Utvecklingsfas aktiveras endast när samtliga kriterier är uppfyllda.", "Aktiverat belopp för egenupparbetning förs till fond för utvecklingsutgifter."], "model": ["Särskilj forskning från utveckling. Om faserna inte kan särskiljas behandlas allt som forskning.", "Testa teknisk möjlighet, avsikt, förmåga att använda/sälja, framtida nytta, resurser och tillförlitlig mätning.", "Anskaffningsvärdet omfattar direkta kostnader och relevanta indirekta kostnader, men inte försäljning, administration, ineffektivitet eller utbildning.", "Bedöm nyttjandeperiod, avskrivningsmetod och restvärde.", "Ej färdigställda egenupparbetade tillgångar kräver årlig återvinningsvärdesberäkning enligt kursmaterialet."], "risks": ["Kostnader aktiveras för tidigt eller utan uppfyllda kriterier.", "Maintenance och buggfixar behandlas som utveckling.", "Fel lön, tid eller övrig kostnad inkluderas.", "Nyttjandeperioden är för lång eller avskrivning startar för sent.", "Nedskrivningsbehov identifieras inte eller bygger på optimistiska kassaflöden."], "procedures": ["Intervjua projektansvariga om status, milstolpar och kommersiell användbarhet.", "IPE-testa tidsredovisningen och stäm mot anläggningsregister och lönedata.", "Analysera tid per person, projekt och tidkod, särskilt utveckling kontra maintenance.", "Granska avtal och tillgångsdefinition för förvärvade rättigheter.", "Granska DCF: specifika kassaflöden, prognosperiod, terminalperiod, WACC, rörelsekapital och känslighet."], "say": "Den centrala revisionsfrågan är inte bara om kostnaden finns, utan om den får aktiveras, är korrekt mätt och fortfarande är återvinningsbar.", "pitfalls": ["Att utgå från projektets namn i stället för faktisk utvecklingsfas.", "Att använda oreviderad tidsrapportering som bevis.", "Att acceptera bolagsvärdet som automatiskt bevis för värdet på en specifik tillgång."], "bdo": ["Planera tillgångsspecifika åtgärder i APT utifrån hur klienten mäter intjäning.", "Överväg subjektivitet och fraud som IRF:er när värderingen är starkt uppskattningsberoende."]}, {"id": "tangibles", "title": "Materiella anläggningstillgångar", "slides": "46–70", "isa": ["ISA 315", "ISA 500", "ISA 540"], "summary": "Definition, anskaffningsvärde, komponenter, tillkommande utgifter, avskrivning, nedskrivning och praktisk revision.", "learn": ["Fysisk tillgång som innehas för produktion, distribution, uthyrning, administration eller långsiktig investering.", "Anskaffningsvärdet omfattar inköpspris och direkt hänförliga kostnader för att få tillgången på plats och i skick.", "Försäljning, administration, marknadsföring, ineffektivitet och utbildning ingår inte.", "K3 kräver komponentindelning när betydande komponenter har väsentligt olika förbrukning.", "Redovisningsmässig nyttjandeperiod och skattemässiga avskrivningsregler är separata bedömningar."], "model": ["Identifiera enhet och komponenter.", vis.", "RADA är riskbedömningsanalys. DAT är dataanalystest och kan likna TOC, SAP eller OSP.", "Kvalitativ och tillräcklig data samt en definierad förväntan är grundkrav.", "Kursmaterialet nämner Excel, Datasnipper, IDEA och Power BI som verktyg.", "ADA kan öka precisionen i riskbedömningen och rikta åtgärder mot en specifik delpopulation."], "model": ["1. Planera syfte, förväntan, data, typ av ADA och assertions.", "2. Säkerställ åtkomst, rätt innehåll, ansvar och tidpunkt.", "3. Bedöm relevans och tillförlitlighet genom IPE-test och vid behov ITGC.", "4. Utför analysen och följ upp population och avvikelser.", "5. Utvärdera fel, planera ytterligare åtgärder och dokumentera slutsats."], "risks": ["Analysen saknar koppling till identifierad risk.", "Populationen är ofullständig eller innehåller fel parametrar.", "Förväntan är för vag för att ge substansbevis.", "Avvikelser följs inte upp till tillräckligt bevis.", "Visualisering misstolkas som en revisionsslutsats."], "procedures": ["RADA: segmentera kundfordringsökning per kund, period eller affärsområde.", "DAT/OSP: matcha fakturalista mot leveransdata och identifiera träffar, avvikelser och saknade poster.", "DAT/SAP: analysera snitthyra eller annan stabil relation.", "Lön: stäm bruttolönelista mot huvudbok och analysera lönearter, förändringar och outliers.", "Dokumentera datakälla, extraktion, transformation, logik, uppföljning och slutsats."], "say": "ADA ger inte automatiskt revisionsbevis. Först måste syftet vara tydligt och datan relevant och tillförlitlig. Sedan följer vi upp varje relevant avvikelse.", "pitfalls": ["Att börja i verktyget i stället för risken.", "Att kalla en generell trendanalys för SAP utan precis förväntan.", "Att glömma IPE-test när data kommer från klienten."], "bdo": ["Kursmaterialet anger ADA som BDO:s term och skiljer RADA från DAT.", "Mallar och instruktionsmaterial anges finnas på intranätet, i APT och OneDrive för revision."]}, {"id": "rev-accounting", "title": "Redovisning av edovisningsstöd och projektarbetspapper."]}, {"id": "rev-audit", "title": "Revision av intäkter", "slides": "117–131", "isa": ["ISA 240", "ISA 315", "ISA 320", "ISA 330", "ISA 520", "ISA 540"], "summary": "Förstå intäktsströmmar, bedöm fraudpresumtionen, koppla risk till assertion och välj TOC, SAP, OSP eller DAT.", "learn": ["Den röda tråden är förstå kundens affär → identifiera risk → planera granskning.", "Först bedöms fraudrisk enligt ISA 240, därefter andra risker och relevanta assertions.", "Standardprogrammet i APT ska anpassas till de specifika riskerna.", "Vanliga svar är TOC, SAP, OSP och DAT.", "BDO Audit Manual 6.15 anges i kursmaterialet som referens för assertions."], "model": ["Kartlägg intäktsströmmar, avtal, system, kontroller och bokföringsflöde.", "Dokumentera fraudpresumtionens uttryck eller grund för att den motbevisas.", "Välj assertion per risk och intäktsström.", "Designa åtgärdens karaktär, tidpunkt och omfattning.", "Utvärdera resultat och om ytterligare åtgärder behövs."], "risks": ["Förtida eller fiktiva intäkter [E].", "Kontanta intäkter undanhålls [C].", "Returer, rabatter och bonusar beaktas inte.", "Upplupna intäkter och färdigställandegrad överdrivs.", "Förskott eller avslutade projekt omförs inte rätt."], "procedures": ["TOC: testa att leveransstatus styr fakturering och att ej levererad order blockeras.", "SAP: revenue proof in total, debiteringsgrad eller bruttovinstanalys med definierad förväntan.", "OSP: faktura, order, avtal, leverans, cut-off och projektkostnader.", "DAT: obruten nummerserie, tidrapporter, kassasystem mot huvudbok och order mot leverans/faktura.", "För automatiska kontroller och konteringslogik kan IT-revisor behövas."], "say": "Vi väljer inte en standardåtgärd först. Vi definierar den specifika risken och assertionen, och därefter avgör vi om TOC, SAP, OSP eller DAT ger rätt bevis.", "pitfalls": ["Generell “intäktsrisk” utan intäktsström, assertion eller scenario.", "SAP utan tillräckligt precis förväntan.", o.", "Att tolka en avvikelse som bevis på fraud utan uppföljning.", "Att missa att underdrift kan vara relevant när ledningen vill flytta resultat mellan år."], "bdo": ["Kursen kopplar åtgärderna till flödesanalys, manuella bokningar, kundbekräftelser och dataanalys."]}, {"id": "inventory-accounting", "title": "Redovisning av varulager", "slides": "147–165", "isa": [], "summary": "Definition, gränsdragning, lägsta värdets princip, anskaffningsvärde, NRV och egentillverkade varor.", "learn": ["Varulager är omsättningstillgångar för försäljning, tillverkning eller förbrukning i produktion/tjänst.", "Lägsta värdets princip jämför anskaffningsvärde med nettoförsäljningsvärde, normalt artikel för artikel.", "Handelsvarors anskaffningsvärde omfattar inköpspris, tull, import, frakt och direkt hänförliga kostnader minus rabatter.", "FIFU eller genomsnittspris används enligt kursens ÅRL-hänvisning.", "Egentillverkade varor omfattar direkt material, direkt lön och relevanta indirekta tillverkningskostnader."], "model": ["Klassificera lagerkategori.", "Fastställ anskaffningsvärde och kostnadsformel.", "Fördela fasta kostnader på normalvolym med relevant nyckel.", "Beräkna nettoförsäljningsvärde efter försäljningskostnader.", "Tillämpa LVP artikelvis eller tillåten homogen grupp."], "risks": ["Lager som hyrs ut långsiktigt klassificeras som varulager.", "Finansieringskomponent eller kreditvillkor inkluderas fel.", "Onormalt spill, lagring, administration eller försäljning läggs i tillverkningskostnaden.", "Fasta omkostnader fördelas på onormal låg volym.", "NRV reduceras inte för direkta försäljningskostnader."], "procedures": ["Testa inköpspris och direkt hänförliga kostnader.", "Kontrollera rabatt, bonus och kreditvillkor.", "Granska kalkyler för material, lön, omkostnad och normalvolym.", "Testa schablon mot faktiska förhållanden och konsekvent tillämpning.", "Jämför utpris minus försäljningskostnader med anskaffningsvärde."], "say": "Lagerfrågan är både vad som ingår i ansk function chapter(c){const secs=chapterSections(c),p=progress(c),allText=secs.map(x=>(x.items||[x.text||'']).join(' ')).join(' '),aa=assertions(allText),book=stars().includes(c.id);return '<div class="chapter"><article class="article"><div class="chapter-kicker">Slides '+esc(c.slides)+'</div><h1>'+esc(c.title)+'</h1><p class="lede">'+esc(c.summary)+'</p><nav class="chapter-tools">'+secs.map(s=>'<button data-jump="'+c.id+'-'+s.kind+'">'+SECTION_LABELS[s.kind]+'</button>').join('')+'</nav>'+secs.map(s=>lesson(c,s)).join('')+'<p style="color:var(--muted);font-size:10px;margin-top:22px">Källa: REV III slides fysiska dagar.pdf, slides '+esc(c.slides)+'. Innehållet är omstrukturerat till kursstöd och är inte en ersättning för full standardtext eller BDO Audit Manual.</p></article><aside class="context"><div class="context-card"><small>KAPITELPULS</small><div class="context-progress"><div class="ring" style="--p:'+(p.done/p.total*100)+'"><b>'+p.done+'/'+p.total+'</b></div><p>Avsnitt avklarade<br><b>'+Math.round(p.done/p.total*100)+'%</b> klart</p></div></div><div class="context-card"><small>RÄKENSKAPSPÅSTÅENDEN</small><h3>Vad kapitlet träffar</h3><div class="assertions">'+(aa.length?aa.map(badge).join(''):'<span style="color:var(--muted)">Ingen automatisk koppling</span>')+'</div></div><div class="context-card"><small>VERKTYG</small><div class="context-actions"><button data-book="'+c.id+'" class="'+(book?'active':'')+'">★ Bokmärk</button><button data-note="'+c.id+'">✎ Anteckna</button><button id="highlightBtn">▰ Markera</button><button data-route="questions">? Träna</button></div></div></aside></div>'}
function glossary(){return '<section class="simple-page"><small>REFERENSBIBLIOTEK</small><h1>Begrepp</h1><div class="term-grid">'+Object.entries(DATA.terms).map(x=>'<article class="term"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></article>').join('')+'</div></section>'}
function questions(){return '<section class="simple-page"><small>MUNTLIG TRÄNING</small><h1>Frågebank</h1><div class="question-list">'+DATA.questions.map((x,i)=>'<article class="question"><small>'+esc(x.chapter)+' · '+(i+1)+'</small><h3>'+esc(x.q)+'</h3><button class="primary reveal">Visa svar</button><div class="answer">'+esc(x.a)+'</div></article>').join('')+'</div></section>'}
function standards(){const all=[...new Set(DATA.chapters.flatMap(c=>c.isa))];return '<section class="simple-page"><small>OFFICIELLA KÄLLOR</small><h1>Standarder</h1><div class="standards-grid">'+all.map(s=>'<a class="standard" target="_blank" rel="noopener" href="'+STD+'"><small>IAASB</small><h3>'+esc(s)+'</h3><span>Öppna officiellt regelverk ↗</span></a>').join('')+'</div></section>'}
function render(){if(route==='home')$('#workspace').innerHTML=home();else if(route==='glossary')$('#workspace').innerHTML=glossary();else if(route==='questions')$('#workspace').innerHTML=questions();else if(route==='standards')$('#workspace').innerHTML=standards();else{const c=DATA.chapters.find(x=>'chapter:'+x.id===route);$('#workspace').innerHTML=c?chapter(c):home()}nav();bind();scrollTo(0,0);localStorage.setItem('r3route',route)}
function bindRoutes(){$$('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;$('#rail').classList.remove('open');render()})}
function bind(){bindRoutes();$$('[data-check]').forEach(b=>b.onclick=()=>{const s=completion();s[b.dataset.check]=!s[b.dataset.check];saveCompletion(s);render()});$$('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'}));$$('[data-book]').forEach(b=>b.onclick=()=>{let a=stars(),id=b.dataset.book;a=a.includes(id)?a.filter(x=>x!==id):[...a,id];saveStars(a);render()});$$('[data-note]').forEach(b=>b.onclick=()=>openNotes(b.dataset.note));$$('.reveal').forEach(b=>b.onclick=()=>{b.closest('.question').classList.toggle('open');b.textContent=b.closest('.question').classList.contains('open')?'Dölj svar':'Visa svar'});const h=$('#highlightBtn');if(h)h.onclick=()=>{highlightMode=!highlightMode;h.classList.toggle('active',highlightMode)}}
function openNotes(k){noteKey=k;$('#noteText').value=localStorage.getItem('r3note-'+k)||'';$('#notes').classList.add('open')}
$('#globalNotes').onclick=()=>openNotes('general');$('#closeNotes').onclick=()=>$('#notes').classList.remove('open');$('#saveNote').onclick=()=>{localStorage.setItem('r3note-'+noteKey,$('#noteText').value);$('#saveNote').textContent='Sparat';setTimeout(()=>$('#saveNote').textContent='Spara',700)};
function openSearch(){$('#searchModal').classList.add('open');$('#searchInput').focus();search('')}function search(q){q=q.toLowerCase().trim();let rows=[];DATA.chapters.forEach(c=>{if(!q||(c.title+' '+c.summary+' '+c.learn.join(' ')).toLowerCase().includes(q))rows.push({r:'chapter:'+c.id,t:c.title,s:c.summary})});Object.entries(DATA.terms).forEach(x=>{if(q&&(x[0]+' '+x[1]).toLowerCase().includes(q))rows.push({r:'glossary',t:x[0],s:x[1]})});$('#searchResults').innerHTML=rows.slice(0,20).map(x=>'<button class="result" data-result="'+x.r+'"><b>'+esc(x.t)+'</b><small>'+esc(x.s)+'</small></button>').join('');$$('[data-result]').forEach(b=>b.onclick=()=>{route=b.dataset.result;$('#searchModal').classList.remove('open');render()})}
$('#openSearch').onclick=openSearch;$('#mobileSearch').onclick=openSearch;$('#searchInput').oninput=e=>search(e.target.value);$('#searchModal').onclick=e=>{if(e.target===$('#searchModal'))$('#searchModal').classList.remove('open')};document.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')$('#searchModal').classList.remove('open')};$('#mobileChapters').onclick=()=>$('#rail').classList.toggle('open');
document.addEventListener('mouseup',()=>{if(!highlightMode)return;const s=getSelection();if(!s||s.isCollapsed||!s.anchorNode?.parentElement.closest('.lesson'))return;const r=s.getRangeAt(0),m=document.createElement('mark');try{m.append(r.extractContents());r.insertNode(m);s.removeAllRanges()}catch{}});document.addEventListener('click',e=>{if(e.target.tagName==='MARK'&&!highlightMode)e.target.replaceWith(...e.target.childNodes)});
route=localStorage.getItem('r3route')||'home';render();</script></body></html>
